<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>misskey-drive-downloader: Download every file in your Misskey drive, keeping the folder structure.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#55ACEE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#55ACEE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="8" fill="#77B255"/>

  <!-- アイコン: Twemoji 📁 (1f4c1) と 📥 (1f4e5) -->
  <circle cx="235" cy="320" r="200" fill="url(#glow)"/>
  <svg x="95" y="150" width="200" height="200" viewBox="0 0 36 36" aria-hidden="true">
    <path fill="#269" d="M0 29c0 2.209 1.791 4 4 4h24c2.209 0 4-1.791 4-4V12c0-2.209-1.791-4-4-4h-9c-3.562 0-3-5-8.438-5H4C1.791 3 0 4.791 0 7v22z"/>
    <path fill="#55ACEE" d="M30 10h-6.562C18 10 18.562 15 15 15H6c-2.209 0-4 1.791-4 4v10c0 .553-.448 1-1 1s-1-.447-1-1c0 2.209 1.791 4 4 4h26c2.209 0 4-1.791 4-4V14c0-2.209-1.791-4-4-4z"/>
  </svg>
  <svg x="175" y="250" width="220" height="220" viewBox="0 0 36 36" aria-hidden="true">
    <path fill="#D99E82" d="M36 32c0 2.209-1.791 4-4 4H4c-2.209 0-4-1.791-4-4v-9c0-2.209.791-3 3-3h30c2.209 0 3 .791 3 3v9z"/>
    <path fill="#662113" d="M25 20c0 3.866-3.134 7-7 7s-7-3.134-7-7h14z"/>
    <path fill="#C1694F" d="M4 36h28c2.209 0 4-1.791 4-4H0c0 2.209 1.791 4 4 4z"/>
    <path fill="#77B255" d="M26.716 8h-4.783V2c0-1.105-.896-2-2-2h-4.001c-1.104 0-1.999.896-1.999 2v6H9.148c-1.223 0-1.516.623-.651 1.489l7.863 7.863c.865.865 2.28.865 3.146 0l7.863-7.863C28.232 8.623 27.94 8 26.716 8z"/>
  </svg>

  <!-- テキスト -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="460" y="150" width="330" height="40" rx="20" fill="#77B255" fill-opacity="0.18" stroke="#77B255" stroke-width="2"/>
    <text x="625" y="177" font-size="20" font-weight="600" fill="#a7d98b" text-anchor="middle">for meiV11 (Misskey v11 fork)</text>

    <text x="460" y="262" font-size="58" font-weight="700" fill="#f8fafc">misskey-drive-downloader</text>

    <text x="460" y="322" font-size="28" fill="#cbd5e1">Download every file in your Misskey drive,</text>
    <text x="460" y="360" font-size="28" fill="#cbd5e1">keeping the folder structure.</text>

    <g font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">
      <rect x="460" y="404" width="210" height="44" rx="10" fill="#334155"/>
      <text x="565" y="433">Python stdlib only</text>
      <rect x="684" y="404" width="140" height="44" rx="10" fill="#334155"/>
      <text x="754" y="433">Resumable</text>
      <rect x="838" y="404" width="150" height="44" rx="10" fill="#334155"/>
      <text x="913" y="433">Auto retry</text>
      <rect x="1002" y="404" width="226" height="44" rx="10" fill="#334155"/>
      <text x="1115" y="433">Windows-safe names</text>
    </g>
  </g>

  <text x="1220" y="590" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="22" fill="#94a3b8" text-anchor="end">github.com/hidao80/meiv11-drive-downloader</text>
</svg>
